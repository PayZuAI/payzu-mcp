language: pt-BR
early_access: true
enable_free_tier: false

reviews:
  profile: assertive
  request_changes_workflow: true
  high_level_summary: true
  high_level_summary_placeholder: '@coderabbitai resumo'
  poem: false
  review_status: true
  collapse_walkthrough: false
  changed_files_summary: true
  sequence_diagrams: false
  assess_linked_issues: true
  related_issues: true
  related_prs: true
  suggested_labels: false
  auto_apply_labels: false
  suggested_reviewers: false
  auto_assign_reviewers: false

  path_instructions:
    - path: 'scripts/**/*.mjs'
      instructions: |
        Revisar em portugues do Brasil. NUNCA usar emojis. NUNCA usar em dash
        (—) ou en dash (–), use hifen (-) ou ponto.

        Codigo de automacao que roda em GitHub Actions com token de app e
        credencial de nuvem, sobre todos os repositorios da organizacao.
        Aplique criterios STRICT:

        - Token, chave ou credencial escrita em log, arquivo ou saida = HIGH.
        - Chamada de API sem tratamento de falha que leve a decisao errada
          (falha silenciosa interpretada como ausencia de dado) = HIGH.
        - Escrita em repositorio de terceiro sem guarda de escopo = HIGH.
        - Conteudo gerado por modelo gravado sem validacao previa = HIGH.
        - Falta de idempotencia em operacao que cria issue, comentario ou
          commit = HIGH.
        - Paginacao incompleta que faca o script concluir por dado parcial = MEDIUM.
        - Limite configuravel sem validacao de faixa = MEDIUM.

        Para cada achado: file:linha, severidade, problema, cenario, fix.

    - path: '.github/workflows/*.yml'
      instructions: |
        Workflow que roda em repositorio de producao. Verificar: permissoes
        minimas por job, action de terceiro fixada por SHA, ausencia de
        pull_request_target com checkout de codigo de fork, secret nao
        exposto em log, e condicao que nao deixe check obrigatorio parado.

  auto_review:
    enabled: true
    auto_incremental_review: true
    drafts: true
    base_branches:
      - main
      - master
      - develop

  tools:
    ast-grep:
      essential_rules: true
      packages: []
    shellcheck:
      enabled: true
    ruff:
      enabled: true
    markdownlint:
      enabled: true
    github-checks:
      enabled: true
      timeout_ms: 120000
    languagetool:
      enabled: false
    biome:
      enabled: true
    hadolint:
      enabled: true
    swiftlint:
      enabled: false
    phpstan:
      enabled: false
    golangci-lint:
      enabled: true
    yamllint:
      enabled: true
    gitleaks:
      enabled: true
    checkov:
      enabled: true
    detekt:
      enabled: false
    eslint:
      enabled: true
    rubocop:
      enabled: false
    buf:
      enabled: false
    regal:
      enabled: false
    actionlint:
      enabled: true
    pmd:
      enabled: false
    cppcheck:
      enabled: false
    semgrep:
      enabled: true
    circleci:
      enabled: false

chat:
  auto_reply: true

knowledge_base:
  opt_out: false
  learnings:
    scope: auto
  issues:
    scope: auto
  jira:
    project_keys: []
  linear:
    team_keys: []
  pull_requests:
    scope: auto
