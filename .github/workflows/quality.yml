name: Quality

permissions:
  contents: read

on:
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dependency_review:
    name: Dependency Review
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Dependency Review (CVE high bloqueia; lib nova mostra OpenSSF Scorecard)
        uses: actions/dependency-review-action@2031cfc080254a8a887f58cffee85186f0e49e48 # v4.9.0
        with:
          fail-on-severity: high
          fail-on-scopes: runtime, development, unknown
          comment-summary-in-pr: always
          show-openssf-scorecard: true
          warn-on-openssf-scorecard-level: 5

  duplication:
    name: Code Duplication
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Setup Node.js (v22)
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22

      - name: jscpd (baseline 9.85% de linhas duplicadas, teto 10.5%)
        working-directory: /tmp
        env:
          NPM_CONFIG_USERCONFIG: /dev/null
          NPM_CONFIG_REGISTRY: https://registry.npmjs.org
          NPM_CONFIG_IGNORE_SCRIPTS: 'true'
        run: npx --yes jscpd@4.2.5 "$GITHUB_WORKSPACE" --min-tokens 70 --format "typescript,tsx,javascript,jsx" --ignore "**/node_modules/**,**/dist/**,**/.next/**,**/generated/**,**/build/**,**/*.min.js,**/coverage/**,**/.nx/**" --threshold 10.5

