name: Release

on:
  release:
    types: [published]
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'
          registry-url: 'https://registry.npmjs.org'
      - run: pnpm install --frozen-lockfile
      - run: pnpm -r build
      - name: Publish payzu-mcp-pix
        working-directory: packages/pix
        run: |
          LOCAL=$(node -p "require('./package.json').version")
          PUBLISHED=$(npm view "payzu-mcp-pix@$LOCAL" version 2>/dev/null || true)
          if [ -n "$PUBLISHED" ]; then
            echo "payzu-mcp-pix@$LOCAL ja publicado, pulando"
          else
            npm publish --access=public --provenance
          fi
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
